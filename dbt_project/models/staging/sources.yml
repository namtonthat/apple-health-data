version: 2

sources:
  - name: hevy
    description: Hevy workout tracking app data from dlt landing zone
    meta:
      owner: data-team
      source_type: api
      zone: landing
    tables:
      - name: workouts
        description: Workout sessions from Hevy API
        external:
          location: "s3://{{ var('s3_bucket') }}/landing/hevy/workouts"
          file_format: delta
        # _dlt_load_id is the pipeline run's unix-epoch start time (as a string);
        # cast + convert gives an actual freshness timestamp for this root table.
        loaded_at_field: to_timestamp(try_cast(_dlt_load_id as double))
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}

      - name: exercises
        description: >
          Exercises within workouts. No freshness check: this is a dlt child
          table and carries no _dlt_load_id (only _dlt_root_id), so there is
          no usable loaded-at field on the table itself.
        external:
          location: "s3://{{ var('s3_bucket') }}/landing/hevy/workouts__exercises"
          file_format: delta

      - name: sets
        description: >
          Individual sets within exercises. No freshness check: this is a dlt
          child table and carries no _dlt_load_id (only _dlt_root_id), so
          there is no usable loaded-at field on the table itself.
        external:
          location: "s3://{{ var('s3_bucket') }}/landing/hevy/workouts__exercises__sets"
          file_format: delta

  - name: apple_health
    description: Apple Health metrics from dlt landing zone
    meta:
      owner: data-team
      source_type: s3_export
      zone: landing
    tables:
      - name: health_metrics
        description: Flattened health metrics from Apple Health JSON exports
        external:
          location: "s3://{{ var('s3_bucket') }}/landing/health/health_metrics"
          file_format: delta
        loaded_at_field: to_timestamp(try_cast(_dlt_load_id as double))
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}

  - name: strava
    description: Strava activity data from dlt landing zone
    meta:
      owner: data-team
      source_type: api
      zone: landing
    tables:
      - name: activities
        description: Activities from Strava API (runs, rides, swims, etc.)
        external:
          location: "s3://{{ var('s3_bucket') }}/landing/strava/activities"
          file_format: delta
        loaded_at_field: to_timestamp(try_cast(_dlt_load_id as double))
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
