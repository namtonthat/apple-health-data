version: 2

models:
  - name: stg_hevy__workouts
    description: Staged workout sessions from Hevy app
    columns:
      - name: workout_id
        description: Primary key (dlt generated)
        tests:
          - unique
          - not_null
      - name: hevy_workout_id
        description: Original Hevy workout ID
      - name: workout_date
        description: Date of the workout
      - name: workout_name
        description: User-defined workout name
      - name: started_at
        description: Workout start timestamp
      - name: ended_at
        description: Workout end timestamp
      - name: duration_minutes
        description: Workout duration in minutes
      - name: day_name
        description: Day of week (Monday, Tuesday, etc.)

  - name: stg_hevy__exercises
    description: Staged exercises within workouts
    columns:
      - name: exercise_id
        description: Primary key (dlt generated)
        tests:
          - unique
          - not_null
      - name: workout_id
        description: Foreign key to workouts
      - name: exercise_name
        description: Name of the exercise
      - name: exercise_order
        description: Order of exercise in workout

  - name: stg_hevy__sets
    description: Staged individual sets within exercises
    columns:
      - name: set_id
        description: Primary key (dlt generated)
        tests:
          - unique
          - not_null
      - name: exercise_id
        description: Foreign key to exercises
      - name: set_number
        description: Set number (1-indexed)
      - name: set_type
        description: Type of set (normal, warmup, dropset, failure)
      - name: weight_kg
        description: Weight lifted in kilograms
      - name: reps
        description: Number of repetitions
      - name: rpe
        description: Rate of Perceived Exertion (1-10 scale)

  - name: stg_health__metrics
    description: Staged Apple Health metrics (deduplicated)
    columns:
      - name: metric_id
        description: Primary key (dlt generated)
        tests:
          - unique
          - not_null
      - name: metric_date
        description: Date of the measurement
      - name: metric_name
        description: Name of the health metric
      - name: value
        description: Measured value
      - name: units
        description: Unit of measurement
      - name: data_source
        description: Source device (Apple Watch, iPhone, etc.)

  - name: stg_strava__activities
    description: Staged activities from Strava (deduplicated)
    columns:
      - name: activity_id
        description: Primary key (Strava activity ID)
      - name: activity_name
        description: Activity title from Strava
      - name: activity_type
        description: Activity type (Run, Ride, Swim, etc.)
      - name: sport_type
        description: Strava's more specific sport classification
      - name: started_at_local
        description: Local start timestamp
      - name: moving_time_minutes
        description: Moving time in minutes
      - name: distance_km
        description: Distance covered in kilometers
      - name: avg_heartrate
        description: Average heart rate for the activity
      - name: is_trainer
        description: Whether the activity was recorded on a stationary trainer

  - name: stg_openpowerlifting__competitions
    description: Staged competition results from OpenPowerlifting
    columns:
      - name: athlete_name
        description: Name of the competing athlete
      - name: competition_name
        description: Name of the competition/meet
      - name: competition_date
        description: Date of the competition
      - name: federation
        description: Powerlifting federation the meet was sanctioned under
      - name: squat_kg
        description: Best squat attempt in kilograms
      - name: bench_kg
        description: Best bench press attempt in kilograms
      - name: deadlift_kg
        description: Best deadlift attempt in kilograms
      - name: total_kg
        description: Total of best squat, bench, and deadlift attempts
      - name: place
        description: Placing within the competition division
