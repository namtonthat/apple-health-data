name: CI

on:
  pull_request:
  push:
    branches: [main]
    # The daily refresh-data.yml bot commit only touches these — no need to
    # re-lint/re-test a pure data refresh (it also carries "[skip ci]", but
    # this covers manual pushes that touch only data too).
    paths-ignore:
      - "web/data/**"
      - "last_updated.txt"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: sqlfluff lint
        run: uv run sqlfluff lint dbt_project/models/

      - name: Run tests
        run: uv run pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
