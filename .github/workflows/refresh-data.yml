name: Refresh Health Data

on:
  schedule:
    # Daily fallback at midnight Melbourne time (13:00 UTC). The primary
    # trigger is the S3-event Lambda (infra/lambda/trigger_refresh.py), which
    # dispatches this workflow when a new Apple Health export lands in S3.
    - cron: '0 13 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      full_refresh:
        description: 'Full refresh: reprocess ALL Apple Health export files (backfill full history). Leave off for normal incremental run.'
        type: boolean
        default: false

permissions:
  contents: write  # push refreshed dashboard.json to main
  actions: write   # dispatch deploy-web.yml after a data commit

# Workflow-level (not job-level) so runs don't overlap but the ingest and
# transform jobs within a single run can execute in parallel.
concurrency:
  group: refresh-data-main
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
  STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
  STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
  STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

jobs:
  # Each source ingests in its own parallel job. The transform job below
  # waits for all of them: delta_scan reading a landing table mid-overwrite
  # returns corrupt results (2026-08-10 run wrote a null-row fct_workout_sets).
  ingest:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        source: [apple-health, hevy, strava, openpowerlifting]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Load config from pyproject.toml
        run: |
          # Extract non-sensitive config from pyproject.toml
          S3_BUCKET=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['dashboard']['s3_bucket_name'])")
          AWS_REGION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['dashboard']['aws_region'])")
          OPL_URL=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['dashboard'].get('openpowerlifting_url', ''))")

          echo "S3_BUCKET_NAME=$S3_BUCKET" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=$AWS_REGION" >> $GITHUB_ENV
          echo "OPENPOWERLIFTING_URL=$OPL_URL" >> $GITHUB_ENV

      - name: Ingest ${{ matrix.source }}
        run: |
          # Skip optional sources whose credentials/config aren't set.
          case "${{ matrix.source }}" in
            hevy)
              [ -z "$HEVY_API_KEY" ] && { echo "HEVY_API_KEY not set; skipping."; exit 0; } ;;
            strava)
              [ -z "$STRAVA_CLIENT_ID" ] && { echo "Strava credentials not set; skipping."; exit 0; } ;;
            openpowerlifting)
              [ -z "$OPENPOWERLIFTING_URL" ] && { echo "OPENPOWERLIFTING_URL not set; skipping."; exit 0; } ;;
          esac
          # Scheduled runs are incremental (latest export only). A manual
          # full_refresh reprocesses every Apple Health export file to backfill
          # history; --all-files is a no-op for the other sources.
          FLAGS=""
          [ "${{ inputs.full_refresh }}" = "true" ] && FLAGS="--all-files"
          uv run python run.py ingest ${{ matrix.source }} $FLAGS

  transform-export:
    # continue-on-error above means a failed source still lets this run —
    # it transforms whatever landed.
    needs: ingest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Load config from pyproject.toml
        run: |
          # Extract non-sensitive config from pyproject.toml
          S3_BUCKET=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['dashboard']['s3_bucket_name'])")
          AWS_REGION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['dashboard']['aws_region'])")

          echo "S3_BUCKET_NAME=$S3_BUCKET" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=$AWS_REGION" >> $GITHUB_ENV

      - name: Transform
        run: uv run python run.py transform

      - name: Export
        run: uv run python run.py export

      - name: Export web dashboard snapshot
        run: uv run python run.py export-web

      - name: Summary
        run: |
          echo "## Data Refresh Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Melbourne Time:** $(TZ='Australia/Melbourne' date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket:** $S3_BUCKET_NAME" >> $GITHUB_STEP_SUMMARY

      - name: Update last_updated timestamp
        run: TZ='Australia/Melbourne' date '+%Y-%m-%d' > last_updated.txt

      - name: Commit and push refreshed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Generated files are full snapshots — ours always wins, so keep
          # them out of the pull entirely. --autostash re-merges them and can
          # commit conflict markers: it exits 0 even when the stash conflicts.
          mv web/data/dashboard.json /tmp/dashboard.json
          mv last_updated.txt /tmp/last_updated.txt
          git checkout -- web/data/dashboard.json last_updated.txt
          git pull --rebase origin main
          mv /tmp/dashboard.json web/data/dashboard.json
          mv /tmp/last_updated.txt last_updated.txt

          python -c "import json; json.load(open('web/data/dashboard.json'))"

          git add last_updated.txt web/data/dashboard.json
          if git diff --staged --quiet; then
            echo "No refreshed data changes to commit."
            echo "committed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "chore: refresh dashboard data [skip ci]"
          git push origin HEAD:main
          echo "committed=true" >> $GITHUB_OUTPUT

      # GITHUB_TOKEN pushes never trigger push workflows (recursion
      # prevention), so redeploy Pages explicitly — workflow_dispatch is
      # exempt from that rule.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.committed == 'true'
        run: gh workflow run deploy-web.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
